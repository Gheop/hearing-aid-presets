# WirePlumber configuration for the GDM greeter, to install as
# /var/lib/gdm/.config/wireplumber/wireplumber.conf.d/51-disable-bluetooth.conf
#
# The greeter starts its own WirePlumber a second after bluetoothd, before any
# user session. Trusted hearing aids reconnect right away, so the greeter's
# WirePlumber negotiates BAP with them and leaves a half-configured ISO group
# in the controller; the user session then gets "Device or resource busy" on
# every stream until the adapter is power-cycled. The greeter has no use for
# Bluetooth audio: keep its WirePlumber away from BlueZ.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
  }
}
